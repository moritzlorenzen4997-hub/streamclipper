<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feierabend</title>
<meta name="description" content="Baustelle ins Handy sprechen – Stundenzettel, Bautagebuch und Rechnung entstehen automatisch.">
<meta name="theme-color" content="#ea580c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4;
  --accent:#ea580c; --accent-ink:#fff; --accent-soft:#ffedd5; --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --card:#1d1b1a; --ink:#f5f5f4; --muted:#a8a29e; --line:#2e2b29;
    --accent:#fb923c; --accent-ink:#1c1917; --accent-soft:#3a2416; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1d1b1a; --ink:#f5f5f4; --muted:#a8a29e; --line:#2e2b29;
  --accent:#fb923c; --accent-ink:#1c1917; --accent-soft:#3a2416; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:14px 16px 110px}
header.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
header.top h1{font-size:1.35rem;margin:0;flex:1}
h2{font-size:.82rem;margin:20px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.sub{color:var(--muted);font-size:.88rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent-soft);color:var(--accent);font-weight:650}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:1.2rem;flex:none}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;font-size:.84rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:520px){ dialog .grid2{grid-template-columns:1fr} }
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:500}
.badge{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.entry .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry ul{margin:6px 0 0;padding-left:20px}
.entry li{margin:2px 0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem}
td.num,th.num{text-align:right}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.empty{color:var(--muted);font-size:.92rem;padding:4px 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:720px;margin:0 auto}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:0;padding:9px 2px 11px;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-size:1.25rem}
nav button.on{color:var(--accent)}
.view{display:none}.view.on{display:block}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem;transition:.25s;z-index:30;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:transparent;color:var(--accent);padding:0}
dialog{border:0;border-radius:16px;padding:0;width:min(680px,calc(100% - 20px));max-height:calc(100% - 30px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dhead{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:1}
dialog .dhead b{flex:1;font-size:1.05rem}
dialog .dbody{padding:4px 16px 16px}
dialog .dfoot{position:sticky;bottom:0;background:var(--card);padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.inv-table input{padding:6px 7px;font-size:.88rem}
.inv-table td{padding:4px 3px}
.totals{margin-left:auto;max-width:300px}
.totals .row{justify-content:space-between}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.pill-select{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.pill-select button{white-space:nowrap;padding:6px 11px;font-size:.85rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
.pill-select button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block;font:11pt/1.4 system-ui,Arial,sans-serif;color:#000}
  #print table th,#print table td{border-bottom:1px solid #ccc;color:#000}
  #print .pagebreak{page-break-before:always}
  #print img{max-width:48%;margin:1%;border:1px solid #ccc}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 id="title">Feierabend</h1>
    <button class="iconbtn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙️</button>
  </header>

  <!-- ERFASSEN -->
  <section class="view on" id="v-heute">
    <div class="card">
      <div class="pill-select" id="projPills"></div>
      <textarea id="dump" placeholder="Einfach reinsprechen, z. B.:&#10;„Bei Müller heute 6 Stunden zu zweit, 2 Steckdosen gesetzt, 12 m Kabel NYM 3x1,5 verlegt, Verteiler angeschlossen“"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="iconbtn mic" id="micBtn" title="Sprechen" aria-label="Sprechen">🎙️</button>
        <label class="iconbtn" style="margin:0;background:var(--accent-soft);border-radius:10px;cursor:pointer" title="Foto" aria-label="Foto">📷<input type="file" id="photoIn" accept="image/*" capture="environment" multiple hidden></label>
        <span class="sub grow" id="photoInfo"></span>
        <button class="primary" id="saveBtn">Erfassen ✓</button>
      </div>
      <div class="hint" id="modeInfo"></div>
    </div>
    <h2 id="todayHead">Heute</h2>
    <div id="todayList"></div>
  </section>

  <!-- BAUSTELLEN -->
  <section class="view" id="v-baustellen">
    <div id="projList"></div>
    <div id="projDetail"></div>
  </section>

  <!-- STUNDEN -->
  <section class="view" id="v-stunden">
    <div class="card">
      <div class="row">
        <button class="ghost" id="wkPrev" aria-label="Vorherige Woche">◀</button>
        <b class="grow" id="wkLabel" style="text-align:center"></b>
        <button class="ghost" id="wkNext" aria-label="Nächste Woche">▶</button>
      </div>
      <div style="overflow-x:auto;margin-top:8px"><table id="wkTable"></table></div>
      <div class="row" style="margin-top:10px"><span class="grow sub" id="wkSum"></span><button id="wkCsv">⬇️ CSV</button></div>
    </div>
  </section>

  <!-- RECHNUNGEN -->
  <section class="view" id="v-rechnungen">
    <div class="card"><div class="stats">
      <div class="stat"><b id="rOpen">0 €</b><span>offen</span></div>
      <div class="stat"><b id="rMonth">0 €</b><span>diesen Monat</span></div>
      <div class="stat"><b id="rUnbilled">0 €</b><span>noch nicht berechnet</span></div>
    </div></div>
    <div class="card" id="invList"></div>
  </section>
</main>

<nav><div class="in">
  <button data-v="heute" class="on"><span class="ic">🎙️</span>Erfassen</button>
  <button data-v="baustellen"><span class="ic">🏗️</span>Baustellen</button>
  <button data-v="stunden"><span class="ic">⏱️</span>Stunden</button>
  <button data-v="rechnungen"><span class="ic">🧾</span>Rechnungen</button>
</div></nav>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Rückgängig</button></div>
<div id="print"></div>

<script type="module">
/* =====================================================================
   Feierabend – Sprach-Assistent für Handwerker
   Sprechen → Stundenzettel + Bautagebuch + Material → Rechnung (PDF)
   Daten bleiben lokal: localStorage (Daten) + IndexedDB (Fotos).
   ===================================================================== */
const $ = s => document.querySelector(s);
const KEY = 'feierabend.v1';
const DEFAULT_MODEL = 'claude-opus-5-5';

/* ---------- Speicher ---------- */
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const blank = () => ({
  company: { name:'', owner:'', street:'', city:'', phone:'', email:'', taxNo:'', vatId:'', iban:'', bic:'', bank:'',
             rate:58, travel:0, vat:19, small:false, prefix:`RE-${new Date().getFullYear()}-`, next:1, terms:14 },
  projects: [], entries: [], prices: {}, invoices: [], current: null
});
let S = Object.assign(blank(), ls.get(KEY, {}));
S.company = Object.assign(blank().company, S.company);
const save = () => { if (!ls.set(KEY, S)) toast('Speicher voll – bitte exportieren'); };

const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('feierabend', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('photos', mode); const req = fn(t.objectStore('photos'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { put:(k,v) => run('readwrite', s => s.put(v,k)), get:k => run('readonly', s => s.get(k)).catch(() => null),
           del:k => run('readwrite', s => s.delete(k)).catch(() => {}) };
})();

/* ---------- Helfer ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const deDate = s => { const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const dayLabel = s => s === today() ? 'Heute' : s === iso(addDays(new Date(),-1)) ? 'Gestern' : `${WD[new Date(s+'T12:00').getDay()]}, ${deDate(s).slice(0,6)}`;
const eur = n => (Math.round(n*100)/100).toLocaleString('de-DE', { style:'currency', currency:'EUR' });
const num = n => (Math.round(n*100)/100).toLocaleString('de-DE', { maximumFractionDigits:2 });
const pnum = s => { const n = parseFloat(String(s).replace(/\./g,'').replace(',','.')); return isNaN(n) ? 0 : n; };
const pnumDot = s => { const n = parseFloat(String(s).replace(',','.')); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round(n*100)/100;
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const tidy = s => s.replace(/\s{2,}/g,' ').replace(/^[\s,;:–-]+|[\s,;:–-]+$/g,'').trim();
const proj = id => S.projects.find(p => p.id === id);
const priceKey = (name, unit) => {
  let n = name.toLowerCase().replace(/\s+/g,' ').trim();
  if (n.length > 5) n = n.replace(/(en|n|e|s)$/,'');
  return `${n}|${unit}`;
};

/* ---------- Lokaler Parser (ohne KI) ---------- */
const NUMWORDS = { ein:1, eine:1, einen:1, einem:1, zwei:2, drei:3, vier:4, 'fünf':5, sechs:6, sieben:7, acht:8, neun:9, zehn:10, elf:11, 'zwölf':12 };
const UNITS = [
  [/^(m²|qm|m2|quadratmeter)$/i, 'm²'], [/^(m³|m3|kubikmeter)$/i, 'm³'], [/^(m|meter|lfm|laufmeter)$/i, 'm'],
  [/^(stk\.?|stück|x)$/i, 'Stk'], [/^(kg|kilo)$/i, 'kg'], [/^(l|liter)$/i, 'l'], [/^(sack|säcke|sackware)$/i, 'Sack'],
  [/^(rolle|rollen)$/i, 'Rolle'], [/^(eimer)$/i, 'Eimer'], [/^(packung|packungen|pkg|pck)$/i, 'Pkg'],
  [/^(karton|kartons)$/i, 'Karton'], [/^(dose|dosen)$/i, 'Dose'], [/^(kartusche|kartuschen)$/i, 'Kartusche'], [/^(platte|platten)$/i, 'Platte']
];
const unitOf = w => { for (const [re,u] of UNITS) if (re.test(w)) return u; return null; };
const VERBS = 'gesetzt|montiert|verlegt|eingebaut|verbaut|getauscht|ausgetauscht|angeschlossen|installiert|verbraucht|benutzt|gestrichen|verputzt|gefliest|verfugt|angebracht|erneuert|ersetzt|geliefert|eingesetzt|aufgebaut|abgebaut|gedämmt|verklebt|geschraubt|befestigt|gezogen';

function parseDay(t, now = new Date()){
  let date = iso(now), m;
  const rm = re => { t = t.replace(re, ' '); };
  if (/(?<!\p{L})vorgestern(?!\p{L})/iu.test(t)) { date = iso(addDays(now,-2)); rm(/(?<!\p{L})vorgestern(?!\p{L})/iu); }
  else if (/\bgestern\b/i.test(t)) { date = iso(addDays(now,-1)); rm(/\bgestern\b/i); }
  else if ((m = t.match(/\b(?:am\s+)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/))) {
    let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
    const d = new Date(y, +m[2]-1, +m[1]); if (!isNaN(d)) { date = iso(d); rm(m[0]); }
  }
  rm(/\bheute\b/i);
  return { date, text: t };
}

function localParse(input, projects){
  let t = ' ' + input.replace(/\s+/g,' ') + ' ';
  const out = { project:null, date:null, hours:null, workers:1, activities:[], materials:[], note:null };
  let m;
  // Datum
  ({ date: out.date, text: t } = parseDay(t));
  // Kunde/Baustelle: "bei Müller", "Baustelle Schulstraße", "Familie Weber"
  const known = (projects || []).filter(p => !p.archived).sort((a,b) => b.name.length - a.name.length)
    .find(p => new RegExp(`(?<!\\p{L})${p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?!\\p{L})`, 'iu').test(t));
  if (known) { out.project = known.name;
    t = t.replace(new RegExp(`(?:\\b[Bb]ei\\s+|\\b[Bb]austelle\\s+)?(?<!\\p{L})${known.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?!\\p{L})`, 'iu'), ' ');
  } else {
    m = t.match(/\b(?:[Bb]ei|[Bb]austelle|[Kk]unde|[Kk]undin|[Pp]rojekt)\s+(?:(?:[Hh]errn?|[Ff]rau|[Ff]amilie|[Ff]am\.|[Ff]irma|[Ff]a\.)\s+)?([A-ZÄÖÜ][\wäöüß.-]*(?:\s+[A-ZÄÖÜ][\wäöüß.-]*)?)/)
     || t.match(/\b(?:[Ff]amilie|[Hh]errn?|[Ff]rau|[Ff]irma)\s+([A-ZÄÖÜ][\wäöüß-]*)/);
    if (m) { out.project = m[1].trim(); t = t.replace(m[0], ' '); }
  }
  // Mitarbeiter
  const crew = { zweit:2, dritt:3, viert:4, 'fünft':5 };
  if ((m = t.match(/\bzu\s+(zweit|dritt|viert|fünft)\b/i))) { out.workers = crew[m[1].toLowerCase()]; t = t.replace(m[0],' '); }
  else if ((m = t.match(/\bmit\s+(\d+|zwei|drei|vier)\s+(?:mann|leuten|leute|gesellen|kollegen|monteuren)\b/i))) { out.workers = NUMWORDS[m[1].toLowerCase()] || +m[1]; t = t.replace(m[0],' '); }
  // Stunden
  if ((m = t.match(/\bvon\s+(\d{1,2})(?:[:.](\d{2}))?\s*(?:uhr)?\s+bis\s+(\d{1,2})(?:[:.](\d{2}))?\s*(?:uhr)?/i))) {
    let h = (+m[3] + (+m[4]||0)/60) - (+m[1] + (+m[2]||0)/60); t = t.replace(m[0],' ');
    const p = t.match(/(?:\b(?:mit|inkl\.?|abzgl\.?)\s+)?(\d+)\s*min(?:uten)?\.?\s*pause|pause\s*(\d+)\s*min(?:uten)?/i);
    if (p) { h -= (+(p[1]||p[2]))/60; t = t.replace(p[0],' '); } else if (/\bpause\b/i.test(t)) { h -= .5; t = t.replace(/(?:\b(?:mit|inkl\.?)\s+)?(?:\w+\s+)?\bpause\b/i,' '); }
    out.hours = r2(Math.max(0,h));
  } else if ((m = t.match(/\b(\d+(?:[.,]\d+)?)\s*(?:stunden|stunde|std\.?|h)(?![\wäöü])/i))) { out.hours = pnumDot(m[1]); t = t.replace(m[0],' ');
  } else if ((m = t.match(/\b(eineinhalb|anderthalb|halbe|eine|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)\s+stunden?\b/i))) {
    const w = m[1].toLowerCase(); out.hours = w === 'halbe' ? .5 : (w === 'eineinhalb' || w === 'anderthalb') ? 1.5 : NUMWORDS[w]; t = t.replace(m[0],' ');
  }
  if ((m = t.match(/\bnotiz\s*:?\s*(.+)$/i))) { out.note = tidy(m[1]); t = t.replace(m[0],' '); }

  const clauses = t.split(/\n+|[;!?]|\.(?=\s|$)|,\s+|\s+und\s+(?=\d|ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)/i).map(tidy).filter(Boolean);
  for (let c of clauses) {
    if (/^(material|verbraucht)\s*:?\s*$/i.test(c)) continue;
    c = c.replace(/^(material|verbraucht)\s*:\s*/i,'');
    if (/^(foto|bild)\b/i.test(c)) { out.note = [out.note, cap(c)].filter(Boolean).join(' · '); continue; }
    const words = c.split(' ');
    let qty = null;
    if (/^\d+(?:[.,]\d+)?$/.test(words[0])) qty = pnumDot(words[0]);
    else if (NUMWORDS[words[0].toLowerCase()] && words.length > 1) qty = NUMWORDS[words[0].toLowerCase()];
    if (qty !== null && words.length > 1) {
      let i = 1, unit = unitOf(words[1]);
      if (unit) i = 2; else unit = 'Stk';
      let name = words.slice(i).join(' ');
      const vm = name.match(new RegExp(`\\s+(${VERBS})$`, 'i'));
      if (vm) { name = name.slice(0, vm.index); out.activities.push(cap(c)); }
      name = tidy(name);
      if (name && !/^(stunden?|std|uhr|min|minuten|mann|leute)$/i.test(name)) { out.materials.push({ name: cap(name), qty, unit }); continue; }
    }
    out.activities.push(cap(c));
  }
  return out;
}

/* ---------- KI-Parser (Claude, optional) ---------- */
const SCHEMA = {
  type:'object', additionalProperties:false,
  required:['project','date','hours','workers','activities','materials','note'],
  properties:{
    project:{ type:['string','null'], description:'Kunde/Baustelle, möglichst einer der bekannten Namen' },
    date:{ type:'string', description:'YYYY-MM-DD' },
    hours:{ type:['number','null'], description:'Arbeitsstunden pro Person' },
    workers:{ type:'integer', description:'Anzahl Personen, Standard 1' },
    activities:{ type:'array', items:{ type:'string' }, description:'Erledigte Arbeiten, kurz, für Bautagebuch & Rechnung' },
    materials:{ type:'array', items:{ type:'object', additionalProperties:false, required:['name','qty','unit'],
      properties:{ name:{type:'string'}, qty:{type:'number'}, unit:{type:'string', description:'Stk, m, m², m³, kg, l, Sack, Rolle, Eimer, Pkg, Karton, Kartusche, Platte'} } } },
    note:{ type:['string','null'], description:'Sonstige Hinweise (Mängel, Absprachen, Fotos), sonst null' }
  }
};
const SYSTEM = `Du bist der Erfassungs-Assistent der Handwerker-App "Feierabend". Ein Handwerker diktiert auf der Baustelle, was er gemacht hat. Wandle das Diktat in einen strukturierten Tagesbericht um:
- project: Kunde oder Baustelle. Wenn ein bekannter Name passt, nimm genau diesen. Wenn keiner genannt ist: null.
- hours: Stunden PRO PERSON (bei "von 7 bis 15:30 mit halber Stunde Pause" = 8). workers: Anzahl Personen ("zu zweit" = 2).
- activities: Erledigte Arbeiten als kurze fachliche Sätze, wie sie in Bautagebuch und Rechnung stehen ("Steckdosen gesetzt (2 Stk)").
- materials: Jedes verbrauchte Material mit Menge und Einheit, fachlich korrekt benannt ("Mantelleitung NYM-J 3x1,5", 12, "m").
- note: Mängel, Absprachen mit dem Kunden, offene Punkte.
Erfinde keine Mengen oder Materialien, die nicht genannt wurden.`;

let Anthropic = null;
async function aiParse(input, apiKey, model){
  if (!Anthropic) Anthropic = (await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.7.0/+esm')).default;
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  const now = new Date();
  const known = S.projects.filter(p => !p.archived).map(p => p.name).join(', ') || '(noch keine)';
  const response = await client.beta.messages.create({
    model, max_tokens: 4000,
    betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
    system: SYSTEM,
    output_config: { effort: 'low', format: { type: 'json_schema', schema: SCHEMA } },
    messages: [{ role:'user', content:`Heute: ${iso(now)} (${WD[now.getDay()]}). Bekannte Baustellen: ${known}.\n\nDiktat:\n${input}` }]
  });
  if (response.stop_reason === 'refusal') throw new Error('abgelehnt');
  return JSON.parse(response.content.filter(b => b.type === 'text').map(b => b.text).join(''));
}

/* ---------- Baustellen ---------- */
function findOrCreateProject(name){
  if (!name) return S.current && proj(S.current) ? S.current : null;
  const n = name.toLowerCase();
  const hit = S.projects.find(p => !p.archived && (p.name.toLowerCase() === n || p.name.toLowerCase().includes(n) || (p.customer||'').toLowerCase().includes(n)));
  if (hit) return hit.id;
  const p = { id: uid(), name: cap(name), customer: cap(name), address: '', createdAt: Date.now(), archived: false };
  S.projects.push(p); toast(`Neue Baustelle „${p.name}“ angelegt`);
  return p.id;
}

/* ---------- Erfassen ---------- */
let pendingPhotos = [];
async function compress(file){
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .72);
}
$('#photoIn').onchange = async e => {
  for (const f of e.target.files) { try { const id = uid(); await idb.put(id, await compress(f)); pendingPhotos.push(id); } catch { toast('Foto konnte nicht gelesen werden'); } }
  e.target.value = ''; $('#photoInfo').textContent = pendingPhotos.length ? `📷 ${pendingPhotos.length} Foto(s) dabei` : '';
};

async function capture(){
  const text = $('#dump').value.trim();
  if (!text && !pendingPhotos.length) return;
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Verarbeite …';
  const key = ls.get('feierabend.key', ''); let r = null, ai = false;
  if (key && text) { try { r = await aiParse(text, key, ls.get('feierabend.model','') || DEFAULT_MODEL); ai = true; } catch (e) { console.warn(e); toast('KI nicht erreichbar – lokal erfasst'); } }
  if (!r) r = localParse(text || '', S.projects);
  btn.disabled = false; btn.textContent = 'Erfassen ✓';
  const projectId = findOrCreateProject(r.project);
  const entry = { id: uid(), projectId, date: r.date || today(), hours: r.hours || 0, workers: Math.max(1, r.workers || 1),
    activities: r.activities || [], materials: (r.materials || []).filter(x => x.name && x.qty), note: r.note || '',
    photos: pendingPhotos, invoiceId: null, raw: text, createdAt: Date.now() };
  S.entries.push(entry); if (projectId) S.current = projectId;
  pendingPhotos = []; $('#photoInfo').textContent = ''; $('#dump').value = '';
  save(); render();
  const parts = [entry.hours && `${num(entry.hours*entry.workers)} Std`, entry.activities.length && `${entry.activities.length} Arbeiten`, entry.materials.length && `${entry.materials.length} Material`].filter(Boolean);
  toast(`${ai ? '✨ ' : '✓ '}${parts.join(' · ') || 'Eintrag'} erfasst${projectId ? '' : ' – Baustelle fehlt'}`, () => { S.entries = S.entries.filter(e => e.id !== entry.id); save(); render(); });
  if (!projectId || !entry.hours) editEntry(entry.id);
}
$('#saveBtn').onclick = capture;
$('#dump').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) capture(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('#micBtn').style.display = 'none';
let rec = null;
$('#micBtn').onclick = () => {
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = false;
  const base = $('#dump').value; let said = '';

/* ---------- Rechnung ---------- */
function buildDraft(projectId){
  const p = proj(projectId), c = S.company;
  const es = S.entries.filter(e => e.projectId === projectId && !e.invoiceId).sort((a,b) => a.date.localeCompare(b.date));
  if (!es.length) return null;
  const hours = es.reduce((s,e) => s + e.hours*e.workers, 0);
  const days = new Set(es.map(e => e.date)).size;
  const items = [];
  if (hours) items.push({ desc:'Arbeitszeit Monteur', qty: r2(hours), unit:'Std', price: c.rate, kind:'labor' });
  if (c.travel > 0) items.push({ desc:'Anfahrtspauschale', qty: days, unit:'Fahrt', price: c.travel, kind:'labor' });
  const mats = {};
  for (const e of es) for (const m of e.materials) { const k = priceKey(m.name, m.unit); (mats[k] ||= { desc: m.name, qty:0, unit: m.unit, price: S.prices[k] ?? 0, kind:'material' }).qty += m.qty; }
  items.push(...Object.values(mats).map(x => ({ ...x, qty: r2(x.qty) })));
  return {
    id: uid(), number: null, projectId, date: today(),
    from: es[0].date, to: es[es.length-1].date,
    customer: p.customer || p.name, address: p.address || '', site: p.site || '', business: !!p.business,
    work: es.flatMap(e => e.activities.map(a => `${deDate(e.date).slice(0,6)} ${a}`)),
    items, entryIds: es.map(e => e.id), paid: false, small: c.small, vat: c.small ? 0 : c.vat
  };
}
const calc = inv => {
  const net = r2(inv.items.reduce((s,i) => s + r2(i.qty*i.price), 0));
  const tax = r2(net * inv.vat / 100);
  const laborNet = r2(inv.items.filter(i => i.kind === 'labor').reduce((s,i) => s + r2(i.qty*i.price), 0));
  return { net, tax, gross: r2(net + tax), labor: r2(laborNet * (1 + inv.vat/100)) };
};

      <table style="width:auto;font-size:10pt"><tr><td>Rechnungs-Nr.</td><td><b>${esc(inv.number)}</b></td></tr><tr><td>Datum</td><td>${deDate(inv.date)}</td></tr>
      <tr><td>Leistungszeitraum</td><td>${deDate(inv.from)}${inv.to !== inv.from ? ' – ' + deDate(inv.to) : ''}</td></tr></table></div>
    ${inv.site ? `<p>Baustelle: ${esc(inv.site)}</p>` : ''}
    ${inv.work.length ? `<p style="margin-bottom:4px"><b>Ausgeführte Arbeiten:</b></p><ul style="margin-top:0">${inv.work.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <table style="margin-top:10px"><thead><tr><th>Pos.</th><th>Bezeichnung</th><th class="num">Menge</th><th>Einh.</th><th class="num">Einzelpreis</th><th class="num">Gesamt</th></tr></thead>
      <tbody>${inv.items.map((i,n) => `<tr><td>${n+1}</td><td>${esc(i.desc)}</td><td class="num">${num(i.qty)}</td><td>${esc(i.unit)}</td><td class="num">${eur(i.price)}</td><td class="num">${eur(i.qty*i.price)}</td></tr>`).join('')}</tbody></table>
    <table style="width:280px;margin:10px 0 0 auto"><tr><td>Nettobetrag</td><td class="num">${eur(t.net)}</td></tr>
      ${inv.small ? '' : `<tr><td>zzgl. USt. ${inv.vat} %</td><td class="num">${eur(t.tax)}</td></tr>`}
      <tr><td><b>Rechnungsbetrag</b></td><td class="num"><b>${eur(t.gross)}</b></td></tr></table>
    ${inv.small ? '<p>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>' : ''}
    ${!inv.business && t.labor ? `<p>Im Rechnungsbetrag enthaltene Arbeits- und Fahrtkosten (§ 35a EStG): <b>${eur(t.labor)}</b>${inv.small ? '' : ' inkl. USt.'}</p>` : ''}
    <p>Bitte überweisen Sie den Betrag bis zum <b>${deDate(due)}</b> unter Angabe der Rechnungsnummer auf das unten genannte Konto. Vielen Dank für Ihren Auftrag!</p>
    <div style="margin-top:30px;padding-top:8px;border-top:1px solid #999;font-size:8.5pt;display:flex;gap:24px;flex-wrap:wrap">
      <div>${esc(c.name)}<br>${esc(c.owner)}</div>
      <div>${c.taxNo ? 'Steuernr.: ' + esc(c.taxNo) + '<br>' : ''}${c.vatId ? 'USt-IdNr.: ' + esc(c.vatId) : ''}</div>
      <div>${esc(c.bank)}<br>IBAN: ${esc(c.iban)}${c.bic ? '<br>BIC: ' + esc(c.bic) : ''}</div></div>`;
  document.title = `${inv.number} ${inv.customer}`;
  setTimeout(() => { window.print(); document.title = 'Feierabend'; }, 150);
}

async function printDiary(projectId){
  const p = proj(projectId);
  const es = S.entries.filter(e => e.projectId === projectId).sort((a,b) => a.date.localeCompare(b.date));
  const hrs = es.reduce((s,e) => s + e.hours*e.workers, 0);
  let html = `${letterhead()}<div style="font-size:15pt;font-weight:800">Bautagebuch – ${esc(p.name)}</div>
    <p>${esc(p.customer)}${p.site ? ' · ' + esc(p.site) : ''}<br>Zeitraum: ${es.length ? deDate(es[0].date) + ' – ' + deDate(es.at(-1).date) : '–'} · Stunden gesamt: ${num(hrs)}</p>`;
  for (const e of es) {
    const imgs = []; for (const id of e.photos) { const d = await idb.get(id); if (d) imgs.push(`<img src="${d}">`); }
    html += `<div style="border-top:1px solid #999;padding-top:6px;margin-top:10px;page-break-inside:avoid"><b>${deDate(e.date)}</b> · ${num(e.hours)} Std${e.workers > 1 ? ` × ${e.workers} Pers.` : ''}
      ${e.activities.length ? `<ul style="margin:4px 0">${e.activities.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      ${e.materials.length ? `<div>Material: ${e.materials.map(m => esc(matLine(m))).join(', ')}</div>` : ''}
      ${e.note ? `<div>Notiz: ${esc(e.note)}</div>` : ''}${imgs.length ? `<div>${imgs.join('')}</div>` : ''}</div>`;
  }
  $('#print').innerHTML = html; document.title = `Bautagebuch ${p.name}`;
  setTimeout(() => { window.print(); document.title = 'Feierabend'; }, 300);
}

/* ---------- Einstellungen ---------- */
function openSettings(){
  const c = S.company;
  const f = (id, l, ph = '', type = 'text') => `<div><label>${l}</label><input id="c_${id}" type="${type}" value="${esc(c[id])}" placeholder="${ph}"></div>`;
  const prices = Object.entries(S.prices).sort();
  openDialog('Einstellungen', `
    <h2 style="margin-top:8px">Firma (steht auf der Rechnung)</h2>
    <div class="grid2">${f('name','Firmenname','Elektro Lorenz')}${f('owner','Inhaber','Max Lorenz')}${f('street','Straße','Hafenstr. 12')}${f('city','PLZ Ort','24103 Kiel')}
      ${f('phone','Telefon')}${f('email','E-Mail')}${f('taxNo','Steuernummer','12/345/67890')}${f('vatId','USt-IdNr. (optional)','DE…')}
      ${f('iban','IBAN','DE…')}${f('bic','BIC (optional)')}${f('bank','Bank')}</div>
    <h2>Preise &amp; Rechnung</h2>
    <div class="grid2">${f('rate','Stundensatz netto (€)','58')}${f('travel','Anfahrt pro Tag netto (€)','0')}
      ${f('vat','USt.-Satz (%)','19')}${f('terms','Zahlungsziel (Tage)','14')}${f('prefix','Rechnungsnr.-Präfix')}${f('next','Nächste laufende Nr.','1')}</div>
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="c_small" style="width:auto" ${c.small ? 'checked' : ''}> Kleinunternehmer nach § 19 UStG (keine USt.)</label>
    <h2>Material-Preisliste (wird beim Abrechnen gelernt)</h2>
    <div id="priceList">${prices.length ? `<table><tbody>${prices.map(([k,v]) => `<tr><td>${esc(k.split('|')[0])}</td><td>${esc(k.split('|')[1])}</td><td style="width:100px"><input data-price="${esc(k)}" inputmode="decimal" value="${num(v)}"></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Noch leer – Preise, die du in einer Rechnung einträgst, werden hier gemerkt.</div>'}</div>
    <h2>✨ KI-Erfassung (optional)</h2>
    <div class="sub">Ohne Schlüssel erkennt die App Diktate lokal. Mit einem Claude-API-Schlüssel versteht sie auch freie Sprache und benennt Material fachlich korrekt.</div>
    <label>Anthropic API-Schlüssel (bleibt auf diesem Gerät)</label><input id="aiKey" type="password" value="${esc(ls.get('feierabend.key',''))}" placeholder="sk-ant-…" autocomplete="off">
    <label>Modell</label><input id="aiModel" value="${esc(ls.get('feierabend.model',''))}" placeholder="${DEFAULT_MODEL}">
    <h2>Daten</h2>
    <div class="chips"><button class="chip" id="xExport">⬇️ Export (ohne Fotos)</button><button class="chip" id="xImport">⬆️ Import</button>
      <button class="chip" id="xDemo">🧪 Beispieldaten</button><button class="chip danger" id="xWipe">🗑️ Alles löschen</button>
      <input type="file" id="xFile" accept="application/json" hidden></div>
    <div class="hint">Alle Daten liegen nur auf diesem Gerät. Exportiere regelmäßig als Sicherung.</div>`,
    `<button data-close>Abbrechen</button><button class="primary" id="cSave">Speichern</button>`);
  $('#cSave').onclick = () => {
    for (const k of Object.keys(c)) { const el = $('#c_' + k); if (!el) continue;
      c[k] = el.type === 'checkbox' ? el.checked : ['rate','travel','vat','terms','next'].includes(k) ? pnum(el.value) : el.value.trim(); }
    c.next = Math.max(1, Math.round(c.next));
    dlg.querySelectorAll('[data-price]').forEach(i => { const v = pnum(i.value); if (v) S.prices[i.dataset.price] = v; else delete S.prices[i.dataset.price]; });
    const k = $('#aiKey').value.trim(); k ? ls.set('feierabend.key', k) : ls.del('feierabend.key');
    ls.set('feierabend.model', $('#aiModel').value.trim());
    save(); dlg.close(); render(); toast('Gespeichert');
  };
  $('#xExport').onclick = () => { const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type:'application/json' })); a.download = `feierabend-${today()}.json`; a.click(); };
  $('#xImport').onclick = () => $('#xFile').click();
  $('#xFile').onchange = async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(d.entries)) throw 0;
    S = Object.assign(blank(), d); S.company = Object.assign(blank().company, d.company); save(); dlg.close(); render(); toast('Importiert'); } catch { toast('Datei ungültig'); } };
  $('#xWipe').onclick = () => { if (confirm('Wirklich ALLE Baustellen, Einträge und Rechnungen löschen?')) { S = blank(); save(); dlg.close(); render(); } };
  $('#xDemo').onclick = () => { loadDemo(); dlg.close(); };
}
$('#settingsBtn').onclick = openSettings;

  const c = S.company;
  if (!c.name) Object.assign(c, { name:'Elektro Beispiel', owner:'Max Muster', street:'Hafenstr. 12', city:'24103 Kiel', phone:'0431 123456', email:'info@elektro-beispiel.de', taxNo:'19/123/45678', iban:'DE02 1203 0000 0000 2020 51', bank:'Musterbank' });
  S.projects.push({ id: uid(), name:'Müller', customer:'Familie Hans Müller', address:'Lindenweg 4\n24105 Kiel', site:'', business:false, archived:false, createdAt: Date.now() },
                  { id: uid(), name:'Bäckerei Jensen', customer:'Bäckerei Jensen GmbH', address:'Markt 1\n24937 Flensburg', site:'Filiale Holstenstraße', business:true, archived:false, createdAt: Date.now() });

/* ---------- Ansichten ---------- */
let openProject = null, weekOffset = 0;
function showView(v){
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v !== 'baustellen') openProject = null;
  render(); window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.v));

const unbilledValue = pid => { const d = buildDraft(pid); return d ? calc(d).net : 0; };

function render(){
  const t = today(), active = S.projects.filter(p => !p.archived);
  $('#modeInfo').textContent = ls.get('feierabend.key','') ? '✨ KI-Erfassung aktiv' : 'Tipp: Kunde, Stunden, Arbeiten und Material in einem Satz – die App sortiert. Strg+Enter speichert.';
  // Baustellen-Auswahl
  $('#projPills').innerHTML = active.map(p => `<button data-pid="${p.id}" class="${S.current === p.id ? 'on' : ''}">${esc(p.name)}</button>`).join('') + '<button data-pid="new">+ Baustelle</button>';
  $('#projPills').onclick = e => { const b = e.target.closest('[data-pid]'); if (!b) return; if (b.dataset.pid === 'new') editProject(null); else { S.current = S.current === b.dataset.pid ? null : b.dataset.pid; save(); render(); } };
  // Heute
  const todays = S.entries.filter(e => e.date === t).sort((a,b) => b.createdAt - a.createdAt);
  const h = todays.reduce((s,e) => s + e.hours*e.workers, 0);
  $('#todayHead').textContent = `Heute${h ? ` · ${num(h)} Std` : ''}`;
  $('#todayList').innerHTML = todays.length ? todays.map(e => entryCard(e)).join('') : '<div class="card empty">Noch nichts erfasst. Sprich einfach los – oder lade unter ⚙️ Beispieldaten.</div>';
  // Baustellen
  if (openProject && proj(openProject)) {
    const p = proj(openProject), es = S.entries.filter(e => e.projectId === p.id).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    const open = es.filter(e => !e.invoiceId), hrs = open.reduce((s,e) => s + e.hours*e.workers, 0);
    $('#projList').innerHTML = '';
    $('#projDetail').innerHTML = `<button class="ghost" id="back">◀ Alle Baustellen</button>
      <div class="card"><div class="row"><div class="grow"><b style="font-size:1.15rem">${esc(p.name)}</b> ${p.archived ? '<span class="badge">abgeschlossen</span>' : ''}<div class="sub" style="white-space:pre-line">${esc(p.customer)}${p.address ? '\n' + esc(p.address) : ''}</div></div><button class="ghost" id="pEdit">✏️</button></div>
        <div class="stats" style="margin-top:10px"><div class="stat"><b>${num(hrs)}</b><span>offene Std</span></div><div class="stat"><b>${open.length}</b><span>offene Einträge</span></div><div class="stat"><b>${eur(unbilledValue(p.id))}</b><span>netto offen</span></div></div>
        <div class="row wrap" style="margin-top:10px"><button class="primary grow" id="pInv" ${open.length ? '' : 'disabled'}>🧾 Rechnung erstellen</button><button class="grow" id="pDiary" ${es.length ? '' : 'disabled'}>📒 Bautagebuch PDF</button></div></div>
      <h2>Bautagebuch</h2>${es.length ? es.map(e => entryCard(e, { showProject:false })).join('') : '<div class="card empty">Noch keine Einträge.</div>'}`;
    $('#back').onclick = () => { openProject = null; render(); };
    $('#pEdit').onclick = () => editProject(p.id);
    $('#pInv').onclick = () => { const d = buildDraft(p.id); if (d) invoiceEditor(d, true); };
    $('#pDiary').onclick = () => printDiary(p.id);
  } else {
    $('#projDetail').innerHTML = '';
    const row = p => { const open = S.entries.filter(e => e.projectId === p.id && !e.invoiceId); const hrs = open.reduce((s,e) => s + e.hours*e.workers, 0);
      const last = S.entries.filter(e => e.projectId === p.id).map(e => e.date).sort().at(-1);
      return `<div class="list-item" data-open="${p.id}"><div class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(p.customer)}${last ? ' · zuletzt ' + dayLabel(last) : ''}</div></div>
        ${hrs ? `<span class="badge">${num(hrs)} h offen</span>` : '<span class="sub">–</span>'}<span class="sub">›</span></div>`; };
    const orphans = S.entries.filter(e => !e.projectId);
    const arch = S.projects.filter(p => p.archived);
    $('#projList').innerHTML = `<div class="row"><h2 class="grow">Aktive Baustellen</h2><button id="newProj">+ Neu</button></div>
      <div class="card">${active.length ? active.map(row).join('') : '<div class="empty">Noch keine Baustelle. Sag einfach „bei Müller …“ – sie wird automatisch angelegt.</div>'}</div>
      ${orphans.length ? `<h2>⚠️ Einträge ohne Baustelle</h2>${orphans.map(e => entryCard(e)).join('')}` : ''}
      ${arch.length ? `<h2>Abgeschlossen</h2><div class="card">${arch.map(row).join('')}</div>` : ''}`;
    $('#newProj').onclick = () => editProject(null);
    $('#projList').onclick = e => { const r = e.target.closest('[data-open]'); if (r) { openProject = r.dataset.open; render(); window.scrollTo({ top:0 }); } };
  }
  // Stunden
  const now = new Date(), mon = addDays(now, -((now.getDay()+6)%7) + weekOffset*7), days = [...Array(7)].map((_,i) => iso(addDays(mon,i)));
  const wk = S.entries.filter(e => e.date >= days[0] && e.date <= days[6]);
  const kw = (() => { const d = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate()+3)); const y = new Date(Date.UTC(d.getUTCFullYear(),0,4)); return 1 + Math.round(((d - y)/864e5 - 3 + ((y.getUTCDay()+6)%7))/7); })();
  $('#wkLabel').textContent = `KW ${kw} · ${deDate(days[0]).slice(0,6)} – ${deDate(days[6]).slice(0,6)}`;
  const wkProj = [...new Set(wk.map(e => e.projectId))];
  const cell = (pid, d) => wk.filter(e => e.projectId === pid && e.date === d).reduce((s,e) => s + e.hours*e.workers, 0);
  const daySum = d => wk.filter(e => e.date === d).reduce((s,e) => s + e.hours*e.workers, 0);
  $('#wkTable').innerHTML = wkProj.length ? `<thead><tr><th>Baustelle</th>${days.map(d => `<th class="num">${WD[new Date(d+'T12:00').getDay()]}</th>`).join('')}<th class="num">Σ</th></tr></thead><tbody>
    ${wkProj.map(pid => `<tr><td>${esc(proj(pid)?.name || '–')}</td>${days.map(d => `<td class="num">${cell(pid,d) ? num(cell(pid,d)) : ''}</td>`).join('')}<td class="num"><b>${num(days.reduce((s,d) => s + cell(pid,d), 0))}</b></td></tr>`).join('')}
    <tr><td><b>Gesamt</b></td>${days.map(d => `<td class="num"><b>${daySum(d) ? num(daySum(d)) : ''}</b></td>`).join('')}<td class="num"><b>${num(wk.reduce((s,e) => s + e.hours*e.workers, 0))}</b></td></tr></tbody>`
    : '<tbody><tr><td class="empty">Keine Stunden in dieser Woche.</td></tr></tbody>';
  const wTotal = wk.reduce((s,e) => s + e.hours*e.workers, 0);
  $('#wkSum').textContent = wTotal ? `${num(wTotal)} Std ≈ ${eur(wTotal * S.company.rate)} netto Arbeitswert` : '';
  // Rechnungen
  const month = t.slice(0,7);
  const openSum = S.invoices.filter(i => !i.paid).reduce((s,i) => s + calc(i).gross, 0);
  $('#rOpen').textContent = eur(openSum);
  $('#rMonth').textContent = eur(S.invoices.filter(i => i.date.startsWith(month)).reduce((s,i) => s + calc(i).net, 0));
  $('#rUnbilled').textContent = eur(active.reduce((s,p) => s + unbilledValue(p.id), 0));
  const invs = [...S.invoices].sort((a,b) => b.number.localeCompare(a.number));
  $('#invList').innerHTML = invs.length ? invs.map(i => { const due = iso(addDays(new Date(i.date+'T12:00'), +S.company.terms || 14)); const late = !i.paid && due < t;
    return `<div class="list-item" data-inv="${i.id}" style="cursor:default"><div class="grow"><b>${esc(i.number)}</b> · ${esc(i.customer)}<div class="sub">${deDate(i.date)} · ${eur(calc(i).gross)}</div></div>
      ${i.paid ? '<span class="badge ok">bezahlt</span>' : late ? '<span class="badge bad">überfällig</span>' : '<span class="badge">offen</span>'}
      <button class="ghost" data-iact="paid" title="Bezahlt umschalten">${i.paid ? '↩️' : '✅'}</button><button class="ghost" data-iact="print" title="PDF">🖨️</button><button class="ghost" data-iact="edit" title="Bearbeiten">✏️</button></div>`; }).join('')
    : '<div class="empty">Noch keine Rechnungen. Öffne eine Baustelle → „Rechnung erstellen“.</div>';
  $('#invList').onclick = e => { const b = e.target.closest('[data-iact]'); if (!b) return; const inv = S.invoices.find(i => i.id === b.closest('[data-inv]').dataset.inv);
    if (b.dataset.iact === 'paid') { inv.paid = !inv.paid; save(); render(); }
    if (b.dataset.iact === 'print') printInvoice(inv);
    if (b.dataset.iact === 'edit') invoiceEditor(JSON.parse(JSON.stringify(inv)), false); };
  loadThumbs();
}
$('#wkPrev').onclick = () => { weekOffset--; render(); };
$('#wkNext').onclick = () => { weekOffset++; render(); };
$('#wkCsv').onclick = () => {
  const now = new Date(), mon = addDays(now, -((now.getDay()+6)%7) + weekOffset*7), end = iso(addDays(mon,6));
  const rows = S.entries.filter(e => e.date >= iso(mon) && e.date <= end).sort((a,b) => a.date.localeCompare(b.date))
    .map(e => [deDate(e.date), proj(e.projectId)?.name || '', num(e.hours), e.workers, num(e.hours*e.workers), e.activities.join(' / ')].map(v => `"${String(v).replace(/"/g,'""')}"`).join(';'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿Datum;Baustelle;Stunden;Personen;Gesamtstunden;Tätigkeiten\n' + rows.join('\n')], { type:'text/csv' }));
  a.download = `stundenzettel-${iso(mon)}.csv`; a.click();
};

let toastTimer;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; $('#toastUndo').style.display = undo ? '' : 'none';
  $('#toastUndo').onclick = () => { undo && undo(); $('#toast').classList.remove('show'); };
  $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4500);
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__fa = { localParse, buildDraft, calc, get S(){ return S; } };
</script>
